version: '3.9'

services:

  # ── PHP + Apache (your app) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carwash_app
    restart: unless-stopped
    ports:
      - "8080:80"           # access at http://localhost:8080
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: car_wash_db
      DB_USER: carwash_user
      DB_PASS: carwash_pass
    volumes:
      - ./application:/var/www/html   # hot-reload during development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carwash_net

  # ── MySQL (replaces XAMPP's MySQL) ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: carwash_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: car_wash_db
      MYSQL_USER: carwash_user
      MYSQL_PASSWORD: carwash_pass
    ports:
      - "3306:3306"         # connect via localhost:3306 (same as XAMPP)
    volumes:
      - db_data:/var/lib/mysql
      - ./car_wash_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carwash_net

  # ── phpMyAdmin (replaces XAMPP's phpMyAdmin) ────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: carwash_pma
    restart: unless-stopped
    ports:
      - "8081:80"           # access at http://localhost:8081
    environment:
      PMA_HOST: db
      PMA_USER: carwash_user
      PMA_PASSWORD: carwash_pass
    depends_on:
      - db
    networks:
      - carwash_net

volumes:
  db_data:

networks:
  carwash_net:
    driver: bridge
