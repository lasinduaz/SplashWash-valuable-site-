<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - Car Wash Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../../static/styles/main.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774278.png" type="image/x-icon">
</head>
<body>
  <div class="container">
    <header class="header fade-in">
      <div class="brand">
        <div class="logo pulse">CW</div>
        <h1>CarWash <small class="small">Demo</small></h1>
      </div>
      <div class="header-cta">
        <nav class="nav" aria-label="Primary">
          <a href="../../../index.html">Home</a>
          <a href="../auth/login.html">Login</a>
          <a href="../auth/register.html">Register</a>
          <a href="../services/view.html">Public Services</a>
          <a href="../learn.html">Learn</a>
        </nav>
      </div>
    </header>

    <main class="row g-4 align-items-start">
      <section class="col-12 col-lg-7">
        <div class="card fade-in stagger-1">
          <h3 class="mt-3">Sign in</h3>
          <p class="small">Welcome back — use your credentials to access the demo dashboard.</p>

          <!-- FIX: autocomplete="off" removed — browsers should be allowed to autofill legitimate forms -->
          <form id="loginForm" novalidate>
            <div class="form-row">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" required autocomplete="username" class="form-control" />
            </div>
            <div class="form-row">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="current-password" class="form-control" />
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button class="btn" id="loginBtn" type="submit">Sign in</button>
              <a class="btn ghost" href="register.html">Create account</a>
            </div>
            <p id="msg" class="small mt-3 text-danger d-none"></p>
          </form>
        </div>
      </section>

      <aside class="col-12 col-lg-5">
        <div class="stack">
          <div class="card fade-in stagger-2">
            <h3>Quick Tips</h3>
            <p class="small mb-0">Use seeded accounts: <strong>admin / admin123</strong>, <strong>tech1 / tech123</strong>.</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- FIX: Removed unused #loginModal markup — it was referenced nowhere and caused confusion -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../../static/scripts/auth.js"></script>
</body>
</html>
