<!-- /application/views/auth/register.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - Car Wash Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="../../static/styles/main.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774278.png" type="image/x-icon">
</head>
<body>
  <div class="container">
    <header class="header fade-in">
      <div class="brand">
        <div class="logo pulse">CW</div>
        <h1>CarWash <small class="small">Demo</small></h1>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="../../../index.html">Home</a>
        <a href="../services/view.html">Services</a>
      </nav>
    </header>

    <main class="row g-4 align-items-start">
      <section class="col-12 col-lg-7">
        <div class="card fade-in stagger-1">
          <h3 class="mt-3">Register</h3>
          <p class="small">Choose username and password. This demo stores plaintext passwords (intentionally).</p>

          <form id="registerForm" novalidate>
            <div class="form-row">
              <label for="rusername">Username</label>
              <input id="rusername" name="username" type="text" required class="form-control" />
            </div>
            <div class="form-row">
              <label for="rpassword">Password</label>
              <input id="rpassword" name="password" type="password" required minlength="6" class="form-control" />
            </div>
            <div class="form-row">
              <label for="role">Role</label>
              <select id="role" name="role" class="form-select">
                <option value="customer">Customer</option>
                <option value="technician">Technician</option>
              </select>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button class="btn" id="registerBtn" type="submit">Register</button>
              <a class="btn ghost" href="login.html">Back to login</a>
            </div>
            <p id="rmsg" class="small mt-3 text-success d-none"></p>
          </form>
        </div>
      </section>

      <aside class="col-12 col-lg-5">
        <div class="stack">
          <div class="card fade-in stagger-2">
            <h3>Why plaintext?</h3>
            <p class="small mb-0">This repository intentionally demonstrates insecure practices. Never store plaintext passwords in real apps.</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../../static/scripts/auth.js"></script>
</body>
</html>
